# SchoolHub — Lightweight task runner config
# This file contains essential single-command shortcuts for SchoolHub development
# For the full task list, use: task --list (Taskfile.yml)

# Quick Commands Reference
# ========================

## Local Development
make dev-backend # Run backend dev server
make dev-frontend # Run frontend dev server
make dev-all # Start full stack via Docker
make dev-tools # Start full stack + PgAdmin

## Build
make build # Build backend + frontend
make build-ui # Build frontend only
make build-backend # Build backend only
make lint # Lint all

## Docker
make docker-up # Start local Docker stack
make docker-down # Stop Docker stack
make docker-prod # Start production Docker stack
make docker-logs # View Docker logs

## Database
make db-generate # Generate Prisma client
make db-migrate # Run dev migrations
make db-migrate-prod # Run prod migrations
make db-seed # Seed database
make db-studio # Open Prisma Studio

## Deploy
make deploy-azure # Trigger Azure DevOps pipeline

## Setup
make env-setup # Create env files from templates
make env-check # Verify env files exist
make verify # Run DevOps verification audit

# Production targets (require .env.production)
.PHONY: docker-prod docker-prod-down deploy-azure db-migrate-prod

docker-prod:
 @echo "Starting production stack..."
 docker compose --env-file .env.production -f docker-compose.prod.yml up -d --pull always

docker-prod-down:
 @echo "Stopping production stack..."
 docker compose --env-file .env.production -f docker-compose.prod.yml down

deploy-azure:
 @echo "Pushing to trigger Azure DevOps pipeline..."
 git push origin HEAD

db-migrate-prod:
 @echo "Running production migrations..."
 docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy

# Docker targets
.PHONY: docker-up docker-down docker-logs

docker-up:
 @./scripts/docker-run.sh

docker-down:
 @docker compose --env-file .env.local down

docker-logs:
 @docker compose logs -f
