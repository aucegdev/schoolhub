# SchoolHub Production Stack — STANDALONE
# Self-contained: does NOT depend on docker-compose.yml.
# Uses .env.production for secrets (created manually on VM, never committed).
#
# On the VM, run:
#   export TAG=<BuildId>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --force-recreate
#
# Prerequisites:
#   /opt/schoolhub/.env.production  — created manually on the VM, chmod 600
#   /opt/schoolhub/nginx/nginx.conf — reverse-proxy config
#   Docker + Docker Compose v2 installed on VM
#
# HTTPS: nginx currently listens on port 80 only.
#   When ready, configure Let's Encrypt via certbot and uncomment the 443
#   block in nginx/nginx.conf, then add "- 443:443" to the nginx ports below.
services:
  postgres:
    image: postgres:15-alpine
    container_name: schoolhub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-schoolhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolhub-network

  backend:
    # TAG is exported by the pipeline deploy script before docker compose pull.
    # Falls back to 'latest' if TAG is not set (manual / emergency deploys).
    image: ${DOCKER_REGISTRY:-schoolhubdev}/schoolhub-backend:${TAG:-latest}
    container_name: schoolhub-backend
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REPORT_SERVICE_URL: http://report-service:8080
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      report-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - schoolhub-network

  frontend:
    # Static nginx image — no runtime env vars needed.
    # VITE_API_URL was baked into the JS bundle at Docker build time.
    image: ${DOCKER_REGISTRY:-schoolhubdev}/schoolhub-frontend:${TAG:-latest}
    container_name: schoolhub-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - schoolhub-network

  report-service:
    # Maven/Java PDF report generator (syllabus build-tool requirement).
    image: ${DOCKER_REGISTRY:-schoolhubdev}/schoolhub-report-service:${TAG:-latest}
    container_name: schoolhub-report-service
    restart: always
    networks:
      - schoolhub-network

  nginx:
    image: nginx:alpine
    container_name: schoolhub-nginx
    restart: always
    ports:
      - "80:80"
      # "443:443"  ← uncomment after configuring Let's Encrypt
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - schoolhub-network

networks:
  schoolhub-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
