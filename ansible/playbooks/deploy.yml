---
- name: Deploy SchoolHub to production
 hosts: production
 become: yes
 vars:
 app_dir: /opt/schoolhub

 tasks:
 - name: Ensure app directory exists
 file:
 path: "{{ app_dir }}"
 state: directory
 owner: schoolhub
 group: schoolhub
 mode: '0755'

 - name: Copy docker-compose files to server
 copy:
 src: ../../
 dest: "{{ app_dir }}/"
 owner: schoolhub
 group: schoolhub
 mode: '0644'
 exclude:
 - node_modules/
 - dist/
 - build/
 - .git/
 - '*.log'
 - Thesis_Title/
 - Thesis_Title/**/*
 - backend/node_modules/
 - backend/dist/
 - frontend/node_modules/
 - frontend/dist/

 - name: Ensure production env file exists
 stat:
 path: "{{ app_dir }}/.env.production"
 register: env_prod

 - name: Fail if .env.production missing (must be provisioned separately)
 fail:
 msg: ".env.production is missing on {{ inventory_hostname }}. Provision it with production secrets before deploying."
 when: not env_prod.stat.exists

 - name: Ensure .env.production has correct permissions
 file:
 path: "{{ app_dir }}/.env.production"
 owner: schoolhub
 group: schoolhub
 mode: '0600'
 when: env_prod.stat.exists

 - name: Pull Docker images
 command: docker compose --env-file .env.production -f docker-compose.prod.yml pull
 args:
 chdir: "{{ app_dir }}"
 become_user: schoolhub

 - name: Start all services
 command: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate
 args:
 chdir: "{{ app_dir }}"
 become_user: schoolhub

 - name: Wait for backend health check
 command: docker inspect --format='{{ "{{" }}.State.Health.Status{{ "}}" }}' schoolhub-backend
 register: backend_health
 retries: 10
 delay: 5
 until: backend_health.stdout == "healthy"

 - name: Verify backend container is running
 command: docker ps -q -f name=schoolhub-backend
 register: backend_running
 failed_when: backend_running.stdout == ""
 changed_when: false

 - name: Verify frontend container is running
 command: docker ps -q -f name=schoolhub-frontend
 register: frontend_running
 failed_when: frontend_running.stdout == ""
 changed_when: false

 - name: Verify nginx container is running
 command: docker ps -q -f name=schoolhub-nginx
 register: nginx_running
 failed_when: nginx_running.stdout == ""
 changed_when: false

 - name: Display deployment summary
 debug:
 msg:
 - "=== Deployment Summary ==="
 - "Backend: {{ backend_running.stdout != '' | ternary('RUNNING', 'FAILED') }}"
 - "Frontend: {{ frontend_running.stdout != '' | ternary('RUNNING', 'FAILED') }}"
 - "Nginx: {{ nginx_running.stdout != '' | ternary('RUNNING', 'FAILED') }}"
 - "Backend health: {{ backend_health.stdout }}"
