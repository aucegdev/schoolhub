# SchoolHub Taskfile - go-task runner commands
version: '3'

tasks:
  default:
    desc: Display all available SchoolHub tasks
    cmds:
      - task --list

  env:setup:
    desc: Set up environment files from templates
    cmds:
      - cp -n .env.example .env.local || true
      - echo "Environment file ready. Configure local database, JWT, and Firebase values in .env.local."

  env:check:
    desc: Verify local environment files
    cmds:
      - test -f .env.local && echo "[OK] .env.local exists" || echo "[MISS] .env.local - run task env:setup"
      - test -f .env.production && echo "[OK] .env.production exists" || echo "[INFO] .env.production not found"

  run:dev:all:
    desc: Build and run the full containerized local stack
    deps: [env:setup]
    cmds:
      - ./scripts/docker-run.sh

  run:dev:ui:
    desc: Run the frontend with the complete containerized application
    cmds:
      - ./scripts/docker-run.sh

  run:dev:backend:
    desc: Run the backend with the complete containerized application
    cmds:
      - ./scripts/docker-run.sh

  run:dev:tools:
    desc: Run the local stack with PgAdmin
    deps: [env:setup]
    cmds:
      - docker compose --env-file .env.local --profile tools up --build -d

  build:ui:
    desc: Build the frontend production bundle
    cmds:
      - npm run build --prefix frontend

  build:backend:
    desc: Build the backend TypeScript bundle
    cmds:
      - npm run build --prefix backend

  build:all:
    desc: Build the complete application
    cmds:
      - npm run build

  lint:all:
    desc: Run all linters
    cmds:
      - npm run lint

  db:generate:
    desc: Generate Prisma client in the running backend container
    cmds:
      - docker compose --env-file .env.local exec -T backend npx prisma generate

  db:migrate:
    desc: Sync the local database schema
    cmds:
      - docker compose --env-file .env.local exec -T backend npx prisma db push

  db:seed:
    desc: Seed local development data
    cmds:
      - docker compose --env-file .env.local exec -T backend npm run seed

  db:studio:
    desc: Open Prisma Studio in the backend container
    cmds:
      - docker compose --env-file .env.local exec backend npx prisma studio --browser none --hostname 0.0.0.0 --port 5555

  docker:up:
    desc: Build and launch all local Docker services
    deps: [env:setup]
    cmds:
      - ./scripts/docker-run.sh

  docker:rebuild:
    desc: Rebuild all local application images without cache
    deps: [env:setup]
    cmds:
      - docker compose --env-file .env.local build --no-cache
      - docker compose --env-file .env.local up -d --remove-orphans

  docker:down:
    desc: Stop and remove local Docker services
    cmds:
      - docker compose --env-file .env.local down

  docker:logs:
    desc: Follow local Docker service logs
    cmds:
      - docker compose --env-file .env.local logs -f

  docker:prod:
    desc: Launch the production Docker stack
    cmds:
      - docker compose --env-file .env.production -f docker-compose.prod.yml up -d --pull always

  test:
    desc: Run backend tests
    dir: backend
    cmds:
      - npm test

  test:frontend:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm test

  verify:devops:
    desc: Run the DevOps deployment verification audit
    cmds:
      - ./scripts/verify-devops-deployment.sh