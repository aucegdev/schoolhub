version: '3.8'

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  backend:
    image: schoolhub-backend:latest
    build:
      context: ./backend
    restart: always
    volumes: []
    ports: [] # Exposed through internal network to nginx
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  frontend:
    image: schoolhub-frontend:latest
    build:
      context: ./frontend
    restart: always
    volumes: []
    ports: [] # Exposed through internal network to nginx
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: schoolhub-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - schoolhub-network

  pgadmin:
    profiles: ["donotstart"]
