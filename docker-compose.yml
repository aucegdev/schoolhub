# SchoolHub Local Development Stack
# Uses .env.local for environment variables
# Run: docker compose up --build
# Or:  task docker:up
# With pgAdmin: docker compose --profile tools up --build

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: schoolhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolhub_pass}
      POSTGRES_DB: ${POSTGRES_DB:-schoolhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolhub-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: schoolhub-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@schoolhub.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolhub-backend
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    container_name: schoolhub-frontend
    ports:
      - "3000:80"
    env_file:
      - .env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - schoolhub-network

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: schoolhub-report-service
    ports:
      - "8080:8080"
    environment:
      - REPORT_SERVICE_PORT=8080
    networks:
      - schoolhub-network

networks:
  schoolhub-network:
    driver: bridge

volumes:
  postgres_data:
